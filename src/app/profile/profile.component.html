<div class="content">

    <div class="profile-header">
        <img src="assets/images/user.jpg" alt="Profile Picture" class="profile-picture" />
        <h1 class="username">John Doe</h1>

    </div>

    <div class="profile-stats">
        <div class="stat">
            <h2>45</h2>
            <p>Followers</p>
        </div>
        <div class="stat1">
            <h2>120</h2>
            <p>following</p>
        </div>
    </div>

</div>
<mat-tab-group>
    <mat-tab label="Posts"><div class="card-container">
        <mat-card *ngFor="let post of posts; trackBy: trackByPostId" appearance="outlined" class="example-card">
            <mat-card-header>
                <div class="header-container">
                    <img src="assets/images/user.jpg" class="avatar1" />
                    <h2 class="name">{{ post.authorPrenom + ' ' + post.authorNom }}</h2>
                </div>

                <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu"
                    class="iconmenu">
                    <mat-icon>more_vert</mat-icon>
                </button>
                <mat-menu #menu="matMenu">
                    <button mat-menu-item (click)="editPost(post)">
                        <mat-icon>edit</mat-icon>
                        <span>edit</span>
                    </button>
                    <button mat-menu-item (click)="deletePost(post.id)">
                        <mat-icon>delete</mat-icon>
                        <span>delete</span>
                    </button>
                </mat-menu>
            </mat-card-header>

            <mat-card-content>

                <p>{{ post.content }}</p>
            </mat-card-content>
            <!-- Check if there are images -->
            <!-- <div class="image-post" *ngIf="post.imageURLs.length > 0; ">
    <div *ngFor="let imageUrl of post.imageURLs" >
        <img [src]="imageUrl" alt="Post Image" />
    </div>

</div> -->
            <div *ngIf="post.imageURLs && post.imageURLs.length > 0" class="image-post">
                <div *ngFor="let imageUrl of post.imageURLs">
                    <img [src]="imageUrl" alt="Post Image">
                </div>
            </div>
            <mat-card-actions>
                <!-- <button mat-button (click)="toggleFavorite(post.id)">
        <mat-icon [class.redIcon]="isFavorite(post.id, userId)">
            {{ isFavorite(post.id, userId) ? 'favorite' : 'favorite_border' }}
        </mat-icon>
        <span *ngIf="post.likes && post.likes.length > 0">{{ post.likes.length }}</span>
    </button> -->
                <button mat-button (click)="toggleFavorite(post.id)">
                    <mat-icon [class.redIcon]="isFavorite(post.id, userId)">
                        {{ isFavorite(post.id, userId) ? 'favorite' : 'favorite_border' }}
                    </mat-icon>
                    <span *ngIf="post.likes && post.likes.length > 0">{{ post.likes.length }}</span>
                </button>

                <button mat-button><!--(click)="toggleCommentSection()"-->
                    <mat-icon>chat_bubble_outline</mat-icon>
                </button>
                <button mat-button><mat-icon>share</mat-icon></button>
            </mat-card-actions>

        </mat-card>
    </div>  </mat-tab>
    <mat-tab label="Photos">  </mat-tab>
    <mat-tab label="Saved"> </mat-tab>
  </mat-tab-group>
