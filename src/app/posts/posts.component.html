<mat-card class="post-card">
    <mat-card-content>
      <div class="user-info">
        <img src="assets/images/image.jpeg" class="avatar" />
        <div class="editable-content" 
             contenteditable="true" 
             [innerText]="postContent"
             [attr.data-placeholder]="'What\'s on your mind?'">
        </div>
      </div>
      <div class="reply-settings" (click)="toggleReplySettings1()">
        <mat-icon>public</mat-icon>
        <span>{{ replySettings }}</span>
      </div>
    </mat-card-content>
  
    <!-- Image Preview Section -->
    <div *ngIf="imagePreviews.length > 0" class="image-preview">
      <div *ngFor="let preview of imagePreviews; let i = index" class="image-item">
        <div class="image-container">
          <img [src]="preview" alt="Selected Image" />
          <button class="delete-button" (click)="removeImage1(i)">×</button>
        </div>
      </div>
    </div>
  
    <mat-card-actions class="toolbar">
      <div class="toolbar-icons">
        <button class="toolbar-button" (click)="triggerFileUpload1()">
          <mat-icon>image</mat-icon>
        </button>
        <input type="file" 
               #fileInput 
               (change)="onFilesSelected($event)" 
               accept="image/*" 
               multiple 
               style="display: none;" />
        <button class="toolbar-button">
          <mat-icon>gif</mat-icon>
        </button>
        <button class="toolbar-button">
          <mat-icon>sentiment_satisfied_alt</mat-icon>
        </button>
      </div>
  
      <div class="action-buttons">
        <button mat-button class="cancel-button" (click)="resetPostForm()">Cancel</button>
        <button mat-raised-button color="primary" 
                class="post-button" 
                [disabled]="!isPostButtonEnabled()" 
                (click)="createPost()">
          Post
        </button>
      </div>
    </mat-card-actions>
  </mat-card>
<p></p>
<p></p>
  <div class="card-container">
    <mat-card *ngFor="let post of posts; trackBy: trackByPostId"  appearance="outlined" class="example-card">          
           <mat-card-header>
            <!-- <img src="assets/images/image.jpeg" class="avatar" /> -->

            <mat-card-title class="name">{{ post.authorPrenom +' '+post.authorNom }}</mat-card-title>
            <div>
                <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu" class="iconmenu">
                    <mat-icon>more_vert</mat-icon>
                  </button>
                  <mat-menu #menu="matMenu">
                    <button mat-menu-item (click)="enableEdit(post)">
                      <mat-icon>edit</mat-icon>
                      <span>edit</span>
                    </button>
                    <button mat-menu-item (click)="deletePost(post.id)">
                      <mat-icon>delete</mat-icon>
                      <span>delete</span>
                    </button>
                  
                  </mat-menu>  
               </div>  
        </mat-card-header>

        <mat-card-content>
            <!-- <p *ngIf="!isEditing[post.id]">{{ post.content }}</p>
            <p contenteditable="true"
                (input)="onContentInput($event, post.id)"
                [textContent]="editedContent[post.id]">
            </p> -->
            <!-- When not editing, show a static paragraph -->
            <p *ngIf="!isEditing[post.id]">{{ post.content }}</p>

            <!-- When editing, show a contenteditable paragraph -->
            <p *ngIf="isEditing[post.id]"
            
                contenteditable="true"
                (input)="onContentInput($event, post.id)"
                [textContent]="editedContent[post.id]">
            </p>
            <!-- <div 
            class="editable-content"
            [attr.contenteditable]="isEditing[post.id] || false" 
            (input)="onContentInput($event, post.id)"
            [innerText]="isEditing[post.id] ? editedContent[post.id] : post.content">
        </div> -->
        </mat-card-content>
        <!-- Check if there are images -->
        <!-- <div class="image-post" *ngIf="post.imageURLs.length > 0; ">
            <div *ngFor="let imageUrl of post.imageURLs" >
                <img [src]="imageUrl" alt="Post Image" />
            </div>
 
        </div> -->
        <div *ngIf="post.imageURLs && post.imageURLs.length > 0" class="image-post">
            <div *ngFor="let imageUrl of post.imageURLs">
                <img [src]="imageUrl" alt="Post Image">
            </div>
        </div>
        <mat-card-actions>
            <button mat-button (click)="toggleFavorite(post.id)">
                <mat-icon [class.redIcon]="isFavorite(post.id, userId)">
                    {{ isFavorite(post.id, userId) ? 'favorite' : 'favorite_border' }}
                </mat-icon>
                <span *ngIf="post.likes && post.likes.length > 0">{{ post.likes.length }}</span>
            </button>

            <button mat-button><!--(click)="toggleCommentSection()"-->
                <mat-icon>chat_bubble_outline</mat-icon>
            </button>
            <button mat-button><mat-icon>share</mat-icon></button>
            <div *ngIf="isEditing[post.id]">
                <button mat-button color="primary" (click)="updatePost(post)">Update</button>
                <button mat-button color="warn" (click)="cancelEdit(post.id)">Cancel</button>
            </div>
        </mat-card-actions>
        <!-- Comment Section -->
        <!-- <div *ngIf="showCommentSection[post.id]" class="comment-section">
            <textarea [(ngModel)]="newComment[post.id]" placeholder="Write a comment..."></textarea>
            <button mat-raised-button color="primary" (click)="submitComment(post.id)">Comment</button>
            <div class="comments-list">
                <div *ngFor="let comment of comments[post.id]" class="comment-item">
                    {{ comment }}
                </div>
            </div>
        </div> -->
    </mat-card>
</div>
