<mat-card class="post-card">
    <mat-card-content>
        <div class="user-info">
            <img src="assets/images/image.jpeg" class="avatar" />
            <div class="editable-content" contenteditable="true" (input)="onContentInput($event)"
                [attr.data-placeholder]="'What\'s on your mind?'"></div>
        </div>
        <div class="reply-settings" (click)="toggleReplySettings1()">
            <mat-icon>public</mat-icon>
            <span>{{ replySettings }}</span>
        </div>
    </mat-card-content>

    <div *ngIf="imagePreviews.length > 0" class="image-preview">
        <div *ngFor="let preview of imagePreviews; let i = index" class="image-item">
            <div class="image-container">
                <img [src]="preview" alt="Selected Image" />
                <button class="delete-button" (click)="removeImage1(i)">×</button>
            </div>
        </div>
    </div>

    <mat-card-actions class="toolbar">
        <div class="toolbar-icons">
            <button class="toolbar-button" (click)="triggerFileUpload1()">
                <mat-icon>image</mat-icon>
            </button>
            <input type="file" #fileInput (change)="onFilesSelected($event)" accept="image/*" multiple
                style="display: none;" />
            <button class="toolbar-button">
                <mat-icon>gif</mat-icon>
            </button>
            <button class="toolbar-button">
                <mat-icon>sentiment_satisfied_alt</mat-icon>
            </button>
            <button class="toolbar-button">
                <mat-icon>event</mat-icon>
            </button>
            <button class="toolbar-button">
                <mat-icon>location_on</mat-icon>
            </button>
        </div>

        <div class="action-buttons">
            <button mat-button class="cancel-button" mat-card-close>Cancel</button>
            <button mat-raised-button color="primary" class="post-button"
                [disabled]="!isPostButtonEnabled()">Post</button>
        </div>
    </mat-card-actions>
</mat-card>

<p></p>
<p></p>

<div class="card-container">
    <mat-card *ngFor="let post of posts" class="example-card" appearance="outlined">
        <mat-card-header>
            <div mat-card-avatar class="example-header-image"></div>
            <mat-card-title>{{ post.authorPrenom +' '+post.authorNom }}</mat-card-title>

            <!-- Menu Button -->
            <button mat-icon-button [matMenuTriggerFor]="postMenu">
                <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #postMenu="matMenu">
                <button mat-menu-item (click)="editPost(post)">
                    <mat-icon>edit</mat-icon>
                    <span>Edit</span>
                </button>
                <button mat-menu-item (click)="deletePost(post)">
                    <mat-icon>delete</mat-icon>
                    <span>Delete</span>
                </button>
            </mat-menu>
        </mat-card-header>

        <mat-card-content>
            <p>{{ post.content }}</p>
        </mat-card-content>

        <div class="image-preview" *ngIf="post.imageURLs.length > 0;">
            <div *ngFor="let imageUrl of post.imageURLs" class="image-item">
                <img [src]="imageUrl" alt="Post Image" />
            </div>
        </div>

        <mat-card-actions>
            <button mat-button><mat-icon>share</mat-icon></button>
        </mat-card-actions>
    </mat-card>
</div>
