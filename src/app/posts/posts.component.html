<!-- posts.component.html -->
<mat-card class="post-card">
    <mat-card-content>
        <div class="user-info">
            <img src="assets/images/image.jpeg" class="avatar"/>
            <div class="editable-content" contenteditable="true" (input)="onContentInput($event)"
                [attr.data-placeholder]="'What\'s on your mind?'"></div>
        </div>
        <div class="reply-settings" (click)="toggleReplySettings1()">
            <mat-icon>public</mat-icon>
            <span>{{ replySettings }}</span>
        </div>
    </mat-card-content>

    <div *ngIf="imagePreviews.length > 0" class="image-preview">
        <div *ngFor="let preview of imagePreviews; let i = index" class="image-item">
            <div class="image-container">
                <img [src]="preview" alt="Selected Image" />
                <button class="delete-button" (click)="removeImage1(i)">×</button>
            </div>
        </div>
    </div>

    <mat-card-actions class="toolbar">
        <div class="toolbar-icons">
            <button class="toolbar-button" (click)="triggerFileUpload1()">
                <mat-icon>image</mat-icon>
            </button>
            <input type="file" #fileInput (change)="onFilesSelected($event)" accept="image/*" multiple
                style="display: none;" />
            <button class="toolbar-button">
                <mat-icon>gif</mat-icon>
            </button>
            <button class="toolbar-button">
                <mat-icon>sentiment_satisfied_alt</mat-icon>
            </button>
            <button class="toolbar-button">
                <mat-icon>event</mat-icon>
            </button>
            <button class="toolbar-button">
                <mat-icon>location_on</mat-icon>
            </button>
        </div>

        <div class="action-buttons">
            <button mat-button class="cancel-button" mat-card-close>Cancel</button>
            <button mat-raised-button color="primary" class="post-button"
                [disabled]="!isPostButtonEnabled()">Post</button>
        </div>
    </mat-card-actions>
</mat-card>

<div class="card-container">
    <mat-card *ngFor="let post of posts" class="example-card" appearance="outlined">
        <mat-icon class="iconmenu">more_vert</mat-icon>
                <mat-card-header>
            <div mat-card-avatar class="example-header-image"></div>
            <mat-card-title>{{ post.authorPrenom +' '+post.authorNom }}</mat-card-title>
            <!-- <mat-card-subtitle>Post ID: {{ post.id }}</mat-card-subtitle> -->
        </mat-card-header>
        <mat-card-content>
            <p>{{ post.content }}</p>
        </mat-card-content>

        <!-- Check if there are images -->
        <div class="image-post" *ngIf="post.imageURLs.length > 0; ">
            <div *ngFor="let imageUrl of post.imageURLs" >
                <img [src]="imageUrl" alt="Post Image" />
            </div>
 
        </div>
        <div *ngIf="post.imageURLs.length === 0 || post.imageURLs===null" >
            <p>there's no media</p>
        </div>
        
        <mat-card-actions>
            <button mat-button (click)="toggleFavorite()">
                <mat-icon [class.redIcon]="isFavorite">
                    {{ isFavorite ? 'favorite' : 'favorite_border' }}
                </mat-icon>
            </button>

             <button mat-button (click)="toggleCommentSection()">
                <mat-icon>chat_bubble_outline</mat-icon>
            </button>
            <button mat-button><mat-icon>share</mat-icon></button>
        </mat-card-actions>

        <!-- Comment Section -->
        <!-- <div *ngIf="showCommentSection[post.id]" class="comment-section">
            <textarea [(ngModel)]="newComment[post.id]" placeholder="Write a comment..."></textarea>
            <button mat-raised-button color="primary" (click)="submitComment(post.id)">Comment</button>
            <div class="comments-list">
                <div *ngFor="let comment of comments[post.id]" class="comment-item">
                    {{ comment }}
                </div>
            </div>
        </div> -->
    </mat-card>
</div>
<mat-toolbar color="primary" class="footer">
    <span></span>
  </mat-toolbar>
